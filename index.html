<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер дней рождения</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Трекер дней рождения</h1>
    <form id="personForm" class="input-section">
      <input type="text" id="nameInput" placeholder="ФИО" autocomplete="off">
      <input type="date" id="birthInput">
      <button type="submit">Добавить</button>
    </form>
    <p id="message" class="message"></p>
    <input type="search" id="searchInput" class="search" placeholder="Поиск по имени...">
    <ul id="personList"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
